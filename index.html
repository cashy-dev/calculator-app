<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Advanced Calculator</h1>
      <p class="sub">Keyboard support • History • % • ± • Memory (MC/MR/M+/M-)</p>
    </header>

    <section class="calc" aria-label="Calculator">
      <div class="display">
        <div id="historyLine" class="history" aria-live="polite"></div>
        <div id="screen" class="screen" aria-live="polite">0</div>
      </div>

      <div class="keys" role="grid" aria-label="Calculator keys">
        <button class="key ghost" data-action="mc">MC</button>
        <button class="key ghost" data-action="mr">MR</button>
        <button class="key ghost" data-action="mplus">M+</button>
        <button class="key ghost" data-action="mminus">M-</button>

        <button class="key warn" data-action="clear">AC</button>
        <button class="key warn" data-action="backspace">⌫</button>
        <button class="key ghost" data-action="sign">±</button>
        <button class="key ghost" data-action="percent">%</button>

        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key op" data-op="÷">÷</button>

        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key op" data-op="×">×</button>

        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key op" data-op="-">−</button>

        <button class="key wide" data-digit="0">0</button>
        <button class="key" data-action="dot">.</button>
        <button class="key op" data-op="+">+</button>

        <button class="key equals" data-action="equals">=</button>
      </div>
    </section>

    <section class="panel" aria-label="History">
      <div class="panel-head">
        <h2>History</h2>
        <button class="small" id="clearHistory">Clear</button>
      </div>
      <ol id="historyList" class="history-list"></ol>
    </section>

    <footer class="foot">
      <span>Tip: Use keyboard (0-9, + - * /, Enter, Backspace, Esc)</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
